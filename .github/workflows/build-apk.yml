name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm install
        run: npm ci
        working-directory: app

      - name: build web + capacitor android
        working-directory: app
        env:
          # absolute base for the apk (webview origin is https://localhost).
          # override via repo variable API_BASE_URL.
          VITE_API_BASE: ${{ vars.API_BASE_URL || 'https://api.pondokhuda.com/api' }}
        run: |
          npm run build
          npx cap add android
          npx cap sync android

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: setup android sdk
        uses: android-actions/setup-android@v3

      - name: install sdk components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: build apk (debug)
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: pondokhuda-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: release to github
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/android/app/build/outputs/apk/debug/app-debug.apk
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            gh release create "${{ github.ref_name }}" "$APK" \
              --title "PondokHuda ${{ github.ref_name }}" \
              --notes "Rilis dari tag ${{ github.ref_name }}." \
              --repo "${{ github.repository }}"
          else
            gh release delete dev --repo "${{ github.repository }}" --yes 2>/dev/null || true
            gh release create dev "$APK" \
              --title "PondokHuda (build otomatis)" \
              --notes "Build otomatis dari main.

commit: ${{ github.sha }}
tanggal: ${{ github.event.head_commit.timestamp }}" \
              --repo "${{ github.repository }}"
          fi