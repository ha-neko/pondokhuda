name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm install
        run: npm ci
        working-directory: app

      - name: build web + capacitor android
        working-directory: app
        env:
          # Production API used by the installed Android application.
          VITE_API_BASE: https://api-pondokhuda.jannahku.com
        run: |
          python3 -m pip install --user pillow
          npm run build
          npx cap add android
          npx cap sync android
          python3 scripts/gen-icons.py android/app/src/main/res

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: setup android sdk
        uses: android-actions/setup-android@v3

      - name: install sdk components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: build apk (debug)
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: release to github
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/android/app/build/outputs/apk/debug/app-debug.apk
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            gh release create "${{ github.ref_name }}" "$APK" \
              --title "Pondok Huda ${{ github.ref_name }}" \
              --notes "Rilis dari tag ${{ github.ref_name }}." \
              --repo "${{ github.repository }}"
          else
            gh release delete dev --repo "${{ github.repository }}" --yes 2>/dev/null || true
            gh release create dev "$APK" \
              --title "Pondok Huda (build otomatis)" \
              --notes "Build otomatis dari main. commit: ${{ github.sha }}" \
              --repo "${{ github.repository }}"
          fi
