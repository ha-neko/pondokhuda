<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koneksi terputus · Pondok Huda</title>
  <style>
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f7f2; color: #1e2620; text-align: center; padding: 24px;
    }
    .card {
      max-width: 380px; background: #ffffff; border: 1px solid #dbe4d5;
      border-radius: 18px; padding: 34px 26px; box-shadow: 0 12px 36px rgba(10,40,20,.08);
    }
    .badge {
      display: inline-grid; place-items: center; width: 56px; height: 56px;
      border-radius: 16px; background: #b9f1b4; color: #05360d; font-size: 28px;
      margin-bottom: 14px;
    }
    h1 { font-size: 19px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.6; color: #57645a; margin: 0 0 18px; }
    button {
      min-height: 42px; padding: 0 20px; border: 0; border-radius: 12px; cursor: pointer;
      background: #2e7d32; color: #ffffff; font-weight: 700; font-size: 14px;
    }
    button:hover { filter: brightness(.95); }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">⚠</div>
    <h1>Koneksi terputus</h1>
    <p>Halaman ini membutuhkan koneksi internet. Periksa jaringan Anda, lalu coba muat ulang.</p>
    <button onclick="location.reload()">Muat ulang</button>
  </div>
</body>
</html>
